name: build

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        setting: [home, clinic, pdonly]
        video: [on, off]
        os: [ubuntu-latest, macOS-latest, windows-latest]
        exclude:
          - os: ubuntu-latest
            setting: clinic
            video: on
          - os: macOS-latest
            setting: clinic
            video: on
          - os: ubuntu-latest
            setting: home
            video: on
          - os: macOS-latest
            setting: home
            video: on
          - os: ubuntu-latest
            setting: pdonly
            video: on
          - os: macOS-latest
            setting: pdonly
            video: on
          - os: ubuntu-latest
            setting: pdonly
            video: off
          - os: macOS-latest
            setting: pdonly
            video: off
          - os: windows-latest
            setting: pdonly
            video: on
      fail-fast: false

    steps:
      # Rewrite "git:" repo urls to use "https:" instead
      - name: Rewrite "git:" repo urls to use "https:" instead.
        run: git config --global url."https://github.com/".insteadOf "git://github.com/"

      # Set up Python
      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: 🅿️ Install Python tools
        run: pip install setuptools

      # Set up Node.js
      - uses: actions/checkout@v4
      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 16.x
          cache: npm

      # Install dependencies
      - name: npm install
        run: |
          npm config set "//npm.pkg.github.com/:_authToken" ${{ secrets.GITHUB_TOKEN }}
          npm ci

      # Load environment
      - name: 🔃 Load .env file (.env.${{matrix.setting}})
        uses: xom9ikk/dotenv@v2
        with:
          path: ./env
          mode: ${{matrix.setting}}

      # Lint the code
      - name: 🔬 Lint
        run: npm run lint -- --max-warnings=0

      # Build the app
      - name: ⚒ Build
        run: npm run build

      # Run tests
      - name: npm test
        run: npm test
        env:
          CI: true